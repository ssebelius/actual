<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Category offer prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Light-theme values of Actual's semantic tokens (DESIGN.md). */
      :root {
        --purple: #8719e0;
        --purple-hover: #a368fc;
        --navy-ink: #102a43;
        --slate: #627d98;
        --mist: #e8ecf0;
        --frost: #f7fafc;
        --ink: #272630;
        --white: #ffffff;
        --red: #e12d39;
        --blue: #1980d4;
        --tint: #f3ebfd; /* rule editor pills */
        --notice-bg: #effcf6; /* noticeBackgroundLight */
        --notice-border: #27ab83; /* noticeBorder */
        --row-highlight: #b3d9ff; /* tableRowBackgroundHighlight */
        --shadow-large:
          0 15px 30px 0 rgba(0, 0, 0, 0.11), 0 5px 15px 0 rgba(0, 0, 0, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 13px;
        color: var(--ink);
        background: var(--mist);
      }
      .num {
        font-feature-settings: 'tnum', 'ss01', 'ss04';
        text-align: right;
      }
      /* Review chrome: not part of the design. */
      .review-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #1b1b1f;
        color: #f2f2f2;
        font-size: 13px;
        min-height: 44px;
      }
      .review-bar .tabs button {
        background: none;
        border: 1px solid #444;
        color: #ddd;
        border-radius: 4px;
        padding: 4px 10px;
        margin-right: 4px;
        cursor: pointer;
        font: inherit;
      }
      .review-bar .tabs button.on {
        background: #f2f2f2;
        color: #1b1b1f;
      }
      .review-bar .caption {
        flex: 1;
        font-size: 15px;
        font-weight: 500;
      }
      .review-bar .reset {
        background: none;
        border: 0;
        color: #aaa;
        cursor: pointer;
        font: inherit;
      }
      /* App shell */
      .app {
        display: flex;
        height: calc(100vh - 44px);
      }
      .sidebar {
        width: 220px;
        background: var(--navy-ink);
        color: #d9e2ec;
        padding: 16px 12px;
        font-size: 13px;
      }
      .sidebar .budget {
        font-weight: 600;
        font-size: 15px;
        color: #fff;
        margin-bottom: 20px;
      }
      .sidebar .item {
        padding: 6px 8px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
      }
      .sidebar .item.on {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 2px 0 0 var(--purple-hover);
      }
      .main {
        flex: 1;
        padding: 20px 24px;
        overflow: auto;
        position: relative;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 4px;
        color: var(--navy-ink);
      }
      .balance {
        font-size: 18px;
        color: var(--red);
        margin-bottom: 16px;
      }
      /* Money table */
      .table {
        background: var(--white);
        border: 1px solid var(--mist);
        border-radius: 6px 6px 0 0;
        max-width: 860px;
      }
      .row {
        display: grid;
        grid-template-columns: 110px 1fr 220px 110px;
        border-bottom: 1px solid var(--mist);
        min-height: 32px;
        align-items: center;
        transition: background-color 0.4s;
      }
      .row > div {
        padding: 0 10px;
      }
      .row.head {
        color: var(--slate);
        background: var(--white);
        font-size: 13px;
        position: sticky;
        top: 0;
      }
      .row:not(.head):hover {
        background: var(--frost);
      }
      .row.changed {
        background: var(--row-highlight);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .row.editing {
        box-shadow: inset 0 0 0 1px var(--purple);
      }
      .cat {
        cursor: pointer;
        position: relative;
        height: 32px;
        display: flex;
        align-items: center;
      }
      .cat.empty {
        color: var(--red);
      }
      .cat:hover {
        text-decoration: underline;
      }
      /* Category picker */
      .picker {
        position: absolute;
        z-index: 20;
        width: 260px;
        background: var(--white);
        border-radius: 4px;
        box-shadow: var(--shadow-large);
        padding: 4px 0;
        font-size: 13px;
      }
      .picker .group {
        color: var(--slate);
        padding: 6px 10px 2px;
        font-size: 12px;
      }
      .picker .opt {
        padding: 5px 10px 5px 18px;
        cursor: pointer;
      }
      .picker .opt:hover,
      .picker .opt.hl {
        background: var(--frost);
      }
      .picker .foot {
        border-top: 1px solid var(--mist);
        margin-top: 4px;
        padding: 8px 10px 4px;
      }
      .picker .foot .btn {
        white-space: normal;
        width: 100%;
        text-align: left;
      }
      .picker .foot .hint {
        color: var(--slate);
        font-size: 12px;
        margin-top: 6px;
      }
      /* Buttons */
      .btn {
        font: inherit;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        border: 1px solid var(--mist);
        background: var(--white);
        color: var(--navy-ink);
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--purple);
        border-color: var(--purple);
        color: #fff;
        transition: box-shadow 0.25s;
      }
      .btn.primary:hover {
        background: var(--purple-hover);
        border-color: var(--purple-hover);
      }
      .btn.bare {
        border-color: transparent;
        background: none;
      }
      .btn.bare:hover {
        background: var(--frost);
      }
      .link {
        color: var(--blue);
        cursor: pointer;
        text-decoration: underline;
      }
      label.check {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--ink);
        cursor: pointer;
      }
      /* A: notification */
      .notice {
        position: fixed;
        right: 13px;
        bottom: 20px;
        width: 400px;
        background: var(--white);
        border-radius: 6px;
        box-shadow: var(--shadow-large);
        padding: 14px 16px;
        z-index: 30;
        font-size: 13px;
        line-height: 1.45;
      }
      .notice .title {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 4px;
        color: var(--navy-ink);
      }
      .notice .actions,
      .strip .actions,
      .pop .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        align-items: center;
      }
      .notice .close {
        position: absolute;
        right: 8px;
        top: 6px;
        border: 0;
        background: none;
        color: var(--slate);
        cursor: pointer;
        font-size: 16px;
      }
      /* B: inline strip */
      .strip {
        grid-column: 1 / -1;
        background: var(--notice-bg);
        border-bottom: 1px solid var(--notice-border);
        border-top: 1px solid var(--notice-border);
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        line-height: 1.45;
      }
      .strip .text {
        flex: 1 1 360px;
      }
      .strip .actions {
        margin-top: 0;
      }
      /* D: review popover */
      .pop {
        position: absolute;
        z-index: 25;
        width: 360px;
        background: var(--white);
        border-radius: 6px;
        box-shadow: var(--shadow-large);
        padding: 14px 16px;
        line-height: 1.45;
      }
      .pop .title {
        font-weight: 600;
        font-size: 14px;
        color: var(--navy-ink);
      }
      .pop .list {
        border: 1px solid var(--mist);
        border-radius: 4px;
        margin-top: 8px;
        max-height: 200px;
        overflow: auto;
      }
      .pop .li {
        display: grid;
        grid-template-columns: 22px 70px 1fr 70px;
        gap: 4px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--mist);
        align-items: center;
      }
      .pop .li:last-child {
        border-bottom: 0;
      }
      .pop .li.grp {
        background: var(--frost);
        color: var(--slate);
      }
      .muted {
        color: var(--slate);
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(16, 42, 67, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }
      .modal {
        background: var(--white);
        border-radius: 6px;
        box-shadow: var(--shadow-large);
        width: 460px;
        padding: 18px 20px;
      }
      .modal h2 {
        font-size: 16px;
        margin: 0 0 12px;
        color: var(--navy-ink);
      }
      .pill {
        background: var(--tint);
        border-radius: 4px;
        padding: 3px 5px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="review-bar">
      <div class="tabs" role="tablist">
        <button data-d="A">A · Notification</button>
        <button data-d="B">B · Inline strip</button>
        <button data-d="C">C · In the picker</button>
        <button data-d="D">D · Review popover</button>
      </div>
      <div class="caption" id="caption"></div>
      <button class="reset" id="reset">Reset</button>
    </div>
    <div class="app">
      <div class="sidebar">
        <div class="budget">Family with kids (sample)</div>
        <div class="item">
          <span>Joint Checking</span><span class="num">14,341.20</span>
        </div>
        <div class="item on">
          <span>Family Rewards Card</span><span class="num">-2,158.44</span>
        </div>
        <div class="item">
          <span>Emergency Fund</span><span class="num">36,000.00</span>
        </div>
      </div>
      <div class="main" id="main">
        <h1>Family Rewards Card</h1>
        <div class="balance num" style="text-align: left">-2,158.44</div>
        <div class="table" id="table"></div>
      </div>
    </div>
    <div id="overlay"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>

    <script>
      // Chick-fil-A rows match the family sample (seed 2026, 6 months, end 2026-09-27).
      // The Kroger, Shell and Costco rows are illustrative.
      const START = [
        ['Aug 15', 'Chick-fil-A', 'Dining Out', 48.36],
        ['Aug 11', 'Kroger', 'Groceries', 118.2],
        ['Jul 22', 'Chick-fil-A', 'Dining Out', 96.13],
        ['Jul 10', 'Chick-fil-A', 'Dining Out', 67.86],
        ['Jul 3', 'Shell', 'Gas', 52.1],
        ['Jun 29', 'Chick-fil-A', 'Dining Out', 69.78],
        ['Jun 28', 'Chick-fil-A', 'Dining Out', 25.23],
        ['Jun 10', 'Chick-fil-A', 'Dining Out', 82.44],
        ['May 17', 'Chick-fil-A', 'Dining Out', 26.52],
        ['May 9', 'Chick-fil-A', 'Dining Out', 53.37],
        ['Apr 25', 'Chick-fil-A', 'Dining Out', 76.28],
        ['Apr 17', 'Chick-fil-A', null, 62.74],
        ['Apr 12', 'Costco', null, 211.4],
        ['Apr 5', 'Chick-fil-A', 'Dining Out', 68.74],
        ['Apr 4', 'Chick-fil-A', null, 53.13],
      ];
      const CATEGORIES = {
        Food: ['Dining Out', 'Fast food', 'Groceries'],
        Car: ['Gas', 'Car Maintenance'],
        Everyday: ['Household Supplies', 'Shopping'],
      };

      let rows, direction, editing, offer, lastApply, highlighted;
      const $ = s => document.querySelector(s);
      const money = n => n.toFixed(2);
      const announce = text => {
        $('#live').textContent = '';
        setTimeout(() => ($('#live').textContent = text), 50);
      };
      let viaKeyboard = false;

      function reset() {
        rows = START.map(([date, payee, category, amount], id) => ({
          id,
          date,
          payee,
          category,
          amount,
          changed: false,
        }));
        editing = null;
        offer = null;
        lastApply = null;
        highlighted = null;
        $('#overlay').innerHTML = '';
        render();
      }

      function setDirection(d) {
        direction = d;
        document
          .querySelectorAll('.tabs button')
          .forEach(b => b.classList.toggle('on', b.dataset.d === d));
        history.replaceState(null, '', '?d=' + d);
        reset();
      }

      // The offer's contents, per the PRD requirements.
      function computeOffer(row) {
        const others = rows.filter(
          r => r.payee === row.payee && r.id !== row.id,
        );
        if (others.length === 0) return null;
        const uncategorized = others.filter(r => !r.category);
        const otherCats = [
          ...new Set(
            others
              .filter(r => r.category && r.category !== row.category)
              .map(r => r.category),
          ),
        ];
        const includable =
          otherCats.length === 1
            ? others.filter(r => r.category === otherCats[0])
            : [];
        return {
          row,
          payee: row.payee,
          category: row.category,
          uncategorized,
          includeCategory: otherCats.length === 1 ? otherCats[0] : null,
          includable,
          include: false,
        };
      }

      function offerSentence(o) {
        const n = o.uncategorized.length;
        const txn = n === 1 ? 'transaction' : 'transactions';
        return n > 0
          ? `Also set ${n} other uncategorized ${o.payee} ${txn} to ${o.category}, and save a rule to use ${o.category} for ${o.payee} from now on?`
          : `Save a rule to use ${o.category} for ${o.payee} from now on?`;
      }

      function apply(o) {
        const targets = [
          ...o.uncategorized,
          ...(o.include ? o.includable : []),
        ];
        lastApply = {
          before: [
            editedBefore,
            ...targets.map(r => [r.id, r.category]),
          ].filter(Boolean),
          count: targets.length,
          payee: o.payee,
          category: o.category,
        };
        rows.forEach(r => (r.changed = false));
        targets.forEach(r => {
          r.category = o.category;
          r.changed = true;
        });
        offer = null;
        editing = null;
        render();
        confirmApplied();
        setTimeout(() => {
          rows.forEach(r => (r.changed = false));
          render();
        }, 2500);
      }

      function undo() {
        if (!lastApply) return;
        lastApply.before.forEach(([id, cat]) => (rows[id].category = cat));
        lastApply = null;
        stripConfirm = null;
        $('#overlay').innerHTML = '';
        render();
        const text = 'Undone. Everything is back as it was before the edit.';
        if (direction === 'B') announce(text);
        else notify(`<div>${text}</div>`);
      }

      function decline() {
        offer = null;
        editing = null;
        $('#overlay').innerHTML = '';
        render();
      }

      function confirmApplied() {
        const { count, payee, category } = lastApply;
        const txn = count === 1 ? 'transaction' : 'transactions';
        const text = `Updated ${count} ${txn} and saved a rule: ${payee} → ${category}.`;
        if (direction === 'B') {
          stripConfirm = text;
          render();
          return;
        }
        notify(
          `<div>${text}</div><div class="actions"><button class="btn" onclick="undo()">Undo</button><span class="link" onclick="viewRule()">View rule</span></div>`,
        );
      }
      let stripConfirm = null;

      function notify(html) {
        $('#overlay').innerHTML =
          `<div class="notice" role="status">${html}</div>`;
        announce($('#overlay .notice').innerText.replace('×', '').trim());
      }

      function viewRule() {
        const payee = lastApply ? lastApply.payee : 'Chick-fil-A';
        const category = lastApply ? lastApply.category : 'Fast food';
        const div = document.createElement('div');
        div.className = 'modal-bg';
        div.innerHTML = `<div class="modal"><h2>Rule</h2><p>If <span class="pill">payee</span> is <span class="pill">${payee}</span></p><p>then set <span class="pill">category</span> to <span class="pill">${category}</span></p><div class="actions" style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="this.closest('.modal-bg').remove()">Close</button></div></div>`;
        document.body.appendChild(div);
      }

      function render() {
        const table = $('#table');
        let html = `<div class="row head"><div>Date</div><div>Payee</div><div>Category</div><div class="num">Payment</div></div>`;
        for (const r of rows) {
          html += `<div class="row${r.changed ? ' changed' : ''}${editing === r.id ? ' editing' : ''}" data-id="${r.id}">
            <div>${r.date}</div><div>${r.payee}</div>
            <div class="cat${r.category ? '' : ' empty'}" data-cat="${r.id}">${r.category || 'Categorize'}</div>
            <div class="num">${money(r.amount)}</div></div>`;
          if (direction === 'B' && offer && offer.row.id === r.id)
            html += stripHtml(offer);
          if (
            direction === 'B' &&
            stripConfirm &&
            lastApply &&
            r.id === stripRow
          )
            html += `<div class="strip" role="status"><div class="text">${stripConfirm}</div><div class="actions"><button class="btn" onclick="undo()">Undo</button><span class="link" onclick="viewRule()">View rule</span><button class="btn bare" onclick="stripConfirm=null;render()">Dismiss</button></div></div>`;
        }
        table.innerHTML = html;
        table
          .querySelectorAll('[data-cat]')
          .forEach(el =>
            el.addEventListener('click', e =>
              openPicker(Number(el.dataset.cat), el),
            ),
          );
      }
      let stripRow = null;

      function stripHtml(o) {
        return `<div class="strip" role="region" aria-label="Category offer">
          <div class="text">${offerSentence(o)}
          ${o.includeCategory ? `<div style="display:flex;gap:12px;align-items:center;margin-top:6px"><label class="check"><input type="checkbox" id="include" ${o.include ? 'checked' : ''} onchange="offer.include=this.checked;render();document.getElementById('include').focus()"> Include ${o.includable.length} marked ${o.includeCategory}</label></div>` : ''}</div>
          <div class="actions">${o.include ? `<button class="btn primary" id="apply" onclick="reviewIncluded()">Review ${o.uncategorized.length + o.includable.length} changes</button>` : `<button class="btn primary" id="apply" onclick="stripRow=offer.row.id;apply(offer)">Apply</button>`}<button class="btn bare" onclick="decline()">Just this one</button></div></div>`;
      }

      function place(el, box, { alignRight = false } = {}) {
        const main = $('#main').getBoundingClientRect();
        const scroll = $('#main').scrollTop;
        const h = el.offsetHeight;
        const below = box.bottom + 4 + h <= window.innerHeight - 8;
        el.style.top =
          (below ? box.bottom + 4 : box.top - h - 4) - main.top + scroll + 'px';
        const left = alignRight ? box.right - el.offsetWidth : box.left;
        el.style.left = Math.max(8, left - main.left) + 'px';
      }

      // B: the preview appears only when already-categorized rows would change.
      function reviewIncluded() {
        const strip = document.querySelector('.strip');
        showPopover(offer, { anchorEl: strip, preselectInclude: true });
      }

      function openPicker(id, anchor) {
        closePicker();
        editing = id;
        render();
        const cell = document.querySelector(`[data-cat="${id}"]`);
        const box = cell.getBoundingClientRect();
        const main = $('#main').getBoundingClientRect();
        const picker = document.createElement('div');
        picker.className = 'picker';
        picker.id = 'picker';
        let html = '';
        for (const [group, cats] of Object.entries(CATEGORIES)) {
          html += `<div class="group">${group}</div>`;
          for (const c of cats)
            html += `<div class="opt" data-opt="${c}">${c}</div>`;
        }
        if (direction === 'C') html += `<div class="foot" id="foot"></div>`;
        picker.innerHTML = html;
        $('#main').appendChild(picker);
        place(picker, box);
        picker.querySelectorAll('[data-opt]').forEach(el => {
          el.addEventListener('click', () => choose(id, el.dataset.opt));
          el.addEventListener('mouseenter', () =>
            highlight(id, el.dataset.opt),
          );
        });
      }

      function closePicker() {
        const p = $('#picker');
        if (p) p.remove();
      }

      // C: the footer describes what the alternate action would do.
      function highlight(id, category) {
        highlighted = category;
        document
          .querySelectorAll('.picker .opt')
          .forEach(o => o.classList.toggle('hl', o.dataset.opt === category));
        if (direction !== 'C') return;
        const draft = { ...rows[id], category };
        const o = computeOffer(draft);
        const foot = $('#foot');
        if (!o) {
          foot.innerHTML = '';
          return;
        }
        const n = o.uncategorized.length;
        foot.innerHTML = `<button class="btn" id="apply-all">${n ? `Also set ${n} uncategorized ${o.payee} and save a rule` : `Save a rule for ${o.payee}`}</button>
          <div class="hint">Enter sets this row only · Shift+Enter applies to all and remembers</div>`;
        $('#apply-all').onclick = () => {
          editedBefore = [id, rows[id].category];
          rows[id].category = category;
          closePicker();
          apply(o);
        };
      }

      let editedBefore = null;
      function choose(id, category) {
        editedBefore = [id, rows[id].category];
        rows[id].category = category;
        closePicker();
        stripConfirm = null;
        if (direction === 'C') {
          editing = null;
          render();
          return;
        }
        offer = computeOffer(rows[id]);
        editing = offer ? id : null;
        render();
        if (!offer) return;
        if (direction === 'A') showNoticeOffer(offer);
        if (direction === 'D') showPopover(offer);
        if (direction === 'B') announce(offerSentence(offer));
        if (viaKeyboard && direction === 'B') $('#apply')?.focus();
        if (viaKeyboard && direction === 'D') $('#pop-apply')?.focus();
        viaKeyboard = false;
      }

      function showNoticeOffer(o) {
        notify(`<button class="close" aria-label="Dismiss" onclick="decline()">×</button>
          <div class="title">${o.payee} → ${o.category}</div>
          <div>${offerSentence(o)}</div>
          ${o.includeCategory ? `<label class="check" style="margin-top:8px"><input type="checkbox" onchange="offer.include=this.checked"> Include ${o.includable.length} marked ${o.includeCategory}</label>` : ''}
          <div class="actions"><button class="btn primary" id="apply" onclick="apply(offer)">Apply</button><button class="btn bare" onclick="decline()">Just this one</button></div>`);
      }

      function showPopover(o, { anchorEl, preselectInclude = false } = {}) {
        const cell =
          anchorEl || document.querySelector(`[data-cat="${o.row.id}"]`);
        const box = cell.getBoundingClientRect();
        const main = $('#main').getBoundingClientRect();
        const pop = document.createElement('div');
        pop.className = 'pop';
        pop.id = 'pop';
        pop.setAttribute('role', 'dialog');
        pop.setAttribute(
          'aria-label',
          'Apply category to matching transactions',
        );
        const item = (r, checked) =>
          `<label class="li"><input type="checkbox" data-r="${r.id}" ${checked ? 'checked' : ''}><span>${r.date}</span><span class="${r.category ? '' : 'muted'}">${r.category || 'Uncategorized'}</span><span class="num">${money(r.amount)}</span></label>`;
        let list = o.uncategorized.map(r => item(r, true)).join('');
        if (o.includeCategory) {
          list += `<div class="li grp"><span></span><span style="grid-column: span 3">${o.includable.length} marked ${o.includeCategory}${preselectInclude ? '' : ', not selected'}</span></div>`;
          list += o.includable.map(r => item(r, preselectInclude)).join('');
        }
        pop.innerHTML = `<div class="title">Use ${o.category} for ${o.payee}?</div>
          <div class="muted">Saves a rule for future ${o.payee} transactions. Selected rows change now.</div>
          <div class="list">${list}</div>
          <div class="actions"><button class="btn primary" id="pop-apply">Apply to <span id="nsel">${o.uncategorized.length + (preselectInclude ? o.includable.length : 0)}</span> and save rule</button><button class="btn bare" onclick="decline()">Just this one</button></div>`;
        $('#main').appendChild(pop);
        place(pop, box, { alignRight: true });
        const sync = () => {
          const ids = [...pop.querySelectorAll('input:checked')].map(i =>
            Number(i.dataset.r),
          );
          $('#nsel').textContent = ids.length;
          return ids;
        };
        pop
          .querySelectorAll('input')
          .forEach(i => i.addEventListener('change', sync));
        $('#pop-apply').onclick = () => {
          const ids = sync();
          const chosen = rows.filter(r => ids.includes(r.id));
          pop.remove();
          if (direction === 'B') stripRow = o.row.id;
          apply({ ...o, uncategorized: chosen, include: false });
        };
      }

      const _decline = decline;
      decline = function () {
        const p = $('#pop');
        if (p) p.remove();
        _decline();
      };

      window.setCaption = text => ($('#caption').textContent = text);
      document
        .querySelectorAll('.tabs button')
        .forEach(b =>
          b.addEventListener('click', () => setDirection(b.dataset.d)),
        );
      $('#reset').addEventListener('click', reset);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closePicker();
          decline();
        }
        if (e.key === 'Enter' && $('#picker') && highlighted != null) {
          const id = editing;
          viaKeyboard = true;
          if (e.shiftKey && direction === 'C') $('#apply-all')?.click();
          else choose(id, highlighted);
        }
      });
      setDirection(new URLSearchParams(location.search).get('d') || 'A');
    </script>
  </body>
</html>
